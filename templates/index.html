<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Pocket Biennale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="intake">
    <h1>The Pocket Biennale</h1>
    <p class="lede">Describe something from your pocket, bag, or desk. The museum will acquire it.</p>
    <form id="form" autocomplete="off">
      <label for="object">What is the object?</label>
      <textarea id="object" name="object" rows="2" maxlength="{{ max_chars }}"
                placeholder="A half-used tube of lip balm, slightly warm" required></textarea>
      <div class="row">
        <span id="count" class="count">0 / {{ max_chars }}</span>
        <button id="go" type="submit">Hang it in the gallery</button>
      </div>
    </form>
    <p id="error" class="error" role="alert" hidden></p>
  </header>

  <main id="stage" class="stage" hidden aria-live="polite">
    <figure class="work">
      <div id="frame" class="frame">
        <p id="frameStatus" class="status">Installing the work…</p>
        <img id="art" alt="" hidden>
      </div>
      <details id="promptBox" class="prompt" hidden>
        <summary>How the image was prompted</summary>
        <p id="imagePrompt"></p>
      </details>
    </figure>

    <aside class="placard" aria-label="Wall label">
      <p id="labelStatus" class="status">Writing the wall label…</p>
      <div id="label" hidden>
        <section class="tombstone">
          <p class="artist"><strong id="tArtist"></strong><br><span id="tBio"></span></p>
          <p class="title"><em id="tTitle"></em>, <span id="tYear"></span></p>
          <p id="tMedium"></p>
          <p id="tDims"></p>
          <p class="small"><em>Provenance:</em> <span id="tProv"></span></p>
          <p class="small" id="tCredit"></p>
        </section>
        <p id="tExtended" class="extended"></p>
      </div>
    </aside>
  </main>

  <footer>
    <p>Every artist, theorist, and institution here is invented. Any resemblance to real reputations is a failure of the machine.</p>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
